<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f0e6">
  <title>Bullet Points</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">AN INFINITE WORD DUNGEON</p>
        <h1>Bullet Points</h1>
      </div>
      <button id="menu-button" class="outline-button" type="button" aria-haspopup="dialog">
        <span aria-hidden="true">Ⅱ</span> PAUSE / SETTINGS
      </button>
    </header>
    <section class="stage" aria-label="Game viewport">
      <canvas id="game" aria-label="Bullet Points game canvas"></canvas>
      <div class="stage-label">GAME SCAFFOLD · READY TO BUILD</div>
    </section>
    <footer>
      <span>WASD / arrows to move</span>
      <span>Dual mobile sticks planned</span>
    </footer>
  </main>

  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <div class="dialog-header">
      <div>
        <p class="eyebrow">RUN CONTROL</p>
        <h2 id="settings-title">PAUSED / SETTINGS</h2>
      </div>
      <button id="close-menu" class="icon-button" type="button" aria-label="Resume and close settings">×</button>
    </div>

    <button id="resume-button" class="primary-button" type="button">RESUME RUN</button>

    <section class="menu-section" aria-labelledby="display-heading">
      <h3 id="display-heading">DISPLAY & SOUND</h3>
      <div class="setting-row">
        <span id="ink-label">Ink colors</span>
        <button id="invert-button" class="outline-button" type="button" aria-pressed="false">INVERT INK: OFF</button>
      </div>
      <label class="setting-row" for="sound-toggle">
        <span><span id="sound-label">Sound effects</span> <small id="sound-note">(ready for audio)</small></span>
        <input id="sound-toggle" type="checkbox" checked>
      </label>
    </section>

    <section class="menu-section" aria-labelledby="controls-heading">
      <h3 id="controls-heading">CONTROLS</h3>
      <label class="choice-row">
        <input type="radio" name="control-scheme" value="keyboard" checked>
        <span id="keyboard-label">Keyboard and mouse</span>
      </label>
      <label class="choice-row">
        <input type="radio" name="control-scheme" value="touch">
        <span><span id="touch-label">Dual mobile sticks</span> <small id="touch-note">(input support is planned)</small></span>
      </label>
    </section>

    <section class="menu-section" aria-labelledby="slots-heading">
      <div class="section-title-row">
        <h3 id="slots-heading">SAVE SLOTS</h3>
        <small id="slot-storage-note">Stored in this browser</small>
      </div>
      <div id="save-slots" class="save-slots"></div>
    </section>

    <div class="dialog-footer">
      <p id="menu-status" role="status" aria-live="polite"></p>
      <button id="restart-button" class="danger-button" type="button">RESTART RUN</button>
    </div>
  </dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
